# 「热读」生产部署（腾讯云轻量服务器，与既有 isME 站点共存）
#
# 用法（服务器上 /data/www/redu，.env.prod 已就位后）：
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   首次/更新后迁移：docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm migrate
#
# 架构说明：
#   - postgres / redis：仅容器网络 + 127.0.0.1 映射（不暴露公网）
#   - api：FastAPI；同时加入 isme_default 外部网络（别名 redu-api），
#     由 isME 的 nginx 容器反代 api.liuxxs.com
#   - worker / beat：Celery 常驻（管线 15min 定跑 + 推送派发 + 透视生成）
#   - secrets：APNs .p8 / Apple Root CA / embedding 模型以只读卷挂入 worker
#   - 环境变量集中在 .env.prod（含 DATABASE_URL 等内网地址）

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: redu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须在 .env.prod 设置}
      POSTGRES_DB: ${POSTGRES_DB:-redu}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./content_engine/migrations/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rd} -d ${POSTGRES_DB:-redu}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redu_redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    image: redu/content-engine:latest
    container_name: redu_migrate
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: ["alembic", "-c", "content_engine/alembic.ini", "upgrade", "head"]

  api:
    build: .
    image: redu/content-engine:latest
    container_name: redu_api
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      default:
      isme_default:          # nginx 容器以 http://redu-api:8000 访问
        aliases:
          - redu-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build: .
    image: redu/content-engine:latest
    container_name: redu_worker
    restart: unless-stopped
    env_file: .env.prod
    command: ["celery", "-A", "content_engine.tasks.celery_app", "worker", "-l", "info"]
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    image: redu/content-engine:latest
    container_name: redu_beat
    restart: unless-stopped
    env_file: .env.prod
    command: ["celery", "-A", "content_engine.tasks.celery_app", "beat", "-l", "info"]
    depends_on:
      redis:
        condition: service_healthy

networks:
  isme_default:
    external: true            # 既有 isME 站点的 compose 网络

volumes:
  pgdata:
  redisdata:
